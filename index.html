<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2333">
  <title>La Société du Lac</title>
  <meta name="description" content="Jeu de gestion paisible en pixel art 3D : veillez sur les installations d'une société secrète au bord d'un lac et découvrez peu à peu ses secrets.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- Ajout à l'écran d'accueil (Android : manifeste ; iOS : balises apple-*) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Société du Lac">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="ui">
    <!-- Écran titre et lettre d'introduction (textes : js/story/intro.js). En premier :
         les Options et la confirmation de nouvelle partie s'affichent par-dessus. -->
    <section class="title-screen" id="title-screen" aria-labelledby="title-name" hidden>
      <div class="title-menu" id="title-menu">
        <h1 class="title-name" id="title-name"></h1>
        <p class="title-subtitle" id="title-subtitle"></p>
        <div class="parchment title-actions">
          <button type="button" class="tool title-continue" id="title-continue" hidden>
            <span id="title-continue-label"></span>
            <span class="title-summary" id="title-summary"></span>
          </button>
          <button type="button" class="tool" id="title-new"></button>
          <button type="button" class="tool secondary" id="title-options" aria-haspopup="dialog"></button>
        </div>
      </div>
      <section class="parchment dialog letter" id="intro-letter" role="dialog" aria-labelledby="letter-title" hidden>
        <h2 id="letter-title"></h2>
        <div class="letter-body" id="letter-body"></div>
        <p class="letter-signature" id="letter-signature"></p>
        <div class="actions">
          <button type="button" class="tool" id="letter-accept"></button>
        </div>
      </section>
      <div class="title-veil" aria-hidden="true"></div>
    </section>

    <!-- Compteurs générés depuis js/resources.js -->
    <div class="top-left">
      <div class="resources" id="resources"></div>
      <!-- Rappel de la missive en cours (js/story/missives.js), repliable -->
      <button type="button" class="parchment missive-reminder" id="missive-reminder"
              aria-expanded="true" hidden>
        <span class="missive-icon" id="missive-icon"></span>
        <span class="missive-short" id="missive-short"></span>
        <span class="missive-count" id="missive-count"></span>
      </button>
    </div>

    <div class="top-right">
      <button type="button" class="parchment journal-button" id="journal-open"
              aria-haspopup="dialog" aria-label="Carnet">
        <span class="journal-icon" id="journal-icon"></span><span>Carnet</span>
        <span class="journal-signal" aria-hidden="true"></span>
      </button>
      <!-- Accès rapides discrets : couper le son, ouvrir les Options -->
      <div class="quick">
        <button type="button" class="parchment quick-button" id="sound-toggle" aria-pressed="false"
                aria-label="Couper le son"><span id="sound-icon"></span></button>
        <button type="button" class="parchment quick-button" id="options-open"
                aria-haspopup="dialog" aria-label="Options" title="Options"><span id="options-icon"></span></button>
      </div>
    </div>

    <p id="hint" class="parchment hint" hidden></p>

    <section class="parchment dialog" id="offline-notice" role="dialog" aria-labelledby="offline-title" hidden>
      <h2 id="offline-title">Retour au domaine</h2>
      <p id="offline-text"></p>
      <div class="actions">
        <button type="button" class="tool" id="offline-close">Reprendre</button>
      </div>
    </section>

    <section class="parchment dialog journal" id="journal" role="dialog" aria-labelledby="journal-title" hidden>
      <h2 id="journal-title">Carnet</h2>
      <div class="missive-box">
        <h3>Missives</h3>
        <p id="missive-text"></p>
        <p class="missive-progress" id="missive-progress"></p>
      </div>
      <!-- Fragments générés depuis js/story/fragments.js -->
      <ol class="fragments" id="fragments"></ol>
      <div class="actions">
        <button type="button" class="tool" id="journal-close">Refermer</button>
      </div>
    </section>

    <!-- Phare du Lac : palier actuel, coût du suivant, « Élever » (non bloquant) -->
    <section class="parchment dialog lighthouse" id="lighthouse" role="dialog" aria-labelledby="lighthouse-title" hidden>
      <h2 id="lighthouse-title">Phare du Lac</h2>
      <ol class="stage-track" id="lighthouse-track" aria-hidden="true"></ol>
      <p class="stage-line" id="lighthouse-stage"></p>
      <p class="stage-effect" id="lighthouse-effect"></p>
      <p class="stage-next" id="lighthouse-next"></p>
      <div class="actions">
        <button type="button" class="tool" id="lighthouse-elevate">Élever</button>
        <button type="button" class="tool secondary" id="lighthouse-close">Refermer</button>
      </div>
    </section>

    <!-- Options : préférences hors sauvegarde de partie, et nouvelle partie -->
    <section class="parchment dialog options" id="options" role="dialog" aria-labelledby="options-title" hidden>
      <h2 id="options-title">Options</h2>
      <div class="option-row">
        <button type="button" class="option-toggle" id="options-sound" aria-pressed="false">
          <span class="option-icon" id="options-sound-icon"></span><span id="options-sound-label">Son</span>
        </button>
        <input type="range" class="sound-volume" id="sound-volume" min="0" max="100" step="5"
               aria-label="Volume">
      </div>
      <div class="option-row">
        <button type="button" class="option-toggle" id="day-toggle" aria-pressed="false">
          <span class="option-icon" id="day-icon"></span><span id="day-label"></span>
        </button>
      </div>
      <div class="actions">
        <button type="button" class="tool secondary" id="new-game">Nouvelle partie</button>
        <button type="button" class="tool" id="options-close">Refermer</button>
      </div>
    </section>

    <div class="backdrop" id="reset-backdrop" hidden>
      <section class="parchment dialog" id="reset-confirm" role="alertdialog"
               aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-text">
        <h2 id="reset-title">Nouvelle partie ?</h2>
        <p id="reset-text">La société oubliera tout : bâtiments, Savoirs et Présages seront effacés.
          Ce choix est définitif.</p>
        <div class="actions">
          <button type="button" class="tool" id="reset-keep">Garder ma partie</button>
          <button type="button" class="tool secondary" id="reset-go">Tout effacer</button>
        </div>
      </section>
    </div>

    <!-- Outils générés depuis js/buildings/catalog.js -->
    <nav class="parchment toolbar" id="toolbar" aria-label="Constructions">
      <!-- Défile horizontalement s'il y a trop d'outils ; bords estompés = autres boutons -->
      <div class="tools" id="tools"></div>
      <button type="button" class="tool cancel" id="cancel" hidden>
        <span aria-hidden="true">✕</span>
        <span class="cancel-label">Annuler</span>
      </button>
    </nav>
  </div>
  <noscript>Ce jeu nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
