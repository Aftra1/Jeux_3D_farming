<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2333">
  <title>La Société du Lac</title>
  <meta name="description" content="Jeu de gestion paisible en pixel art 3D : veillez sur les installations d'une société secrète au bord d'un lac et découvrez peu à peu ses secrets.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- Ajout à l'écran d'accueil (Android : manifeste ; iOS : balises apple-*) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Société du Lac">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="ui">
    <!-- Compteur d'images par seconde (Options, masqué par défaut) -->
    <div class="fps-counter" id="fps-counter" aria-hidden="true" hidden></div>
    <!-- Écran titre et lettre d'introduction (textes : js/story/intro.js). En premier :
         les Options et la confirmation de nouvelle partie s'affichent par-dessus. -->
    <section class="title-screen" id="title-screen" aria-labelledby="title-name" hidden>
      <div class="title-menu" id="title-menu">
        <h1 class="title-name" id="title-name"></h1>
        <p class="title-subtitle" id="title-subtitle"></p>
        <div class="parchment title-actions">
          <button type="button" class="tool title-continue" id="title-continue" hidden>
            <span class="title-continue-line"><span id="title-continue-label"></span><span class="title-mark" id="title-mark" role="img" hidden></span></span>
            <span class="title-summary" id="title-summary"></span>
          </button>
          <button type="button" class="tool" id="title-new"></button>
          <button type="button" class="tool secondary" id="title-options" aria-haspopup="dialog"></button>
        </div>
      </div>
      <section class="parchment dialog letter" id="intro-letter" role="dialog" aria-labelledby="letter-title" hidden>
        <h2 id="letter-title"></h2>
        <div class="letter-body" id="letter-body"></div>
        <p class="letter-signature" id="letter-signature"></p>
        <div class="actions">
          <button type="button" class="tool" id="letter-accept"></button>
        </div>
      </section>
      <div class="title-veil" aria-hidden="true"></div>
    </section>

    <!-- Séquence de fin (textes : js/story/ending.js) : « Passer », lettre, générique, résumé.
         Avant les compteurs : l'interface de jeu est masquée pendant la séquence. -->
    <section class="ending" id="ending" hidden>
      <button type="button" class="tool secondary ending-skip" id="ending-skip"></button>
      <section class="parchment dialog letter" id="ending-letter" role="dialog" aria-labelledby="ending-letter-title" hidden>
        <h2 id="ending-letter-title"></h2>
        <div class="letter-body" id="ending-letter-body"></div>
        <p class="letter-signature" id="ending-letter-signature"></p>
        <div class="actions">
          <button type="button" class="tool" id="ending-next"></button>
        </div>
      </section>
      <section class="ending-final" id="ending-final" aria-labelledby="credits-title" hidden>
        <div class="credits">
          <h2 class="credits-title" id="credits-title"></h2>
          <div class="credits-lines" id="credits-lines"></div>
        </div>
        <div class="parchment summary">
          <h3 id="summary-title"></h3>
          <dl class="summary-rows" id="summary-rows"></dl>
          <div class="actions">
            <button type="button" class="tool" id="ending-stay"></button>
          </div>
        </div>
      </section>
    </section>

    <!-- Mode économie d'énergie : écran parchemin à la place de la scène (js/ui/eco.js) -->
    <section class="eco" id="eco" aria-labelledby="eco-title" hidden></section>

    <!-- Compteurs générés depuis js/resources.js -->
    <div class="top-left">
      <!-- But du chapitre (js/story/guide.js) : titre, progression, fine barre ; ouvre le Carnet -->
      <button type="button" class="parchment objective" id="objective" data-t-aria="objective.aria" hidden>
        <span class="objective-line">
          <span class="objective-title" id="objective-title"></span>
          <span class="objective-count" id="objective-count"></span>
        </span>
        <span class="objective-track" aria-hidden="true"><i id="objective-bar"></i></span>
      </button>
      <div class="resources" id="resources"></div>
      <!-- Rappel de la missive en cours (js/story/missives.js), repliable -->
      <button type="button" class="parchment missive-reminder" id="missive-reminder"
              aria-expanded="true" hidden>
        <span class="missive-icon" id="missive-icon"></span>
        <span class="missive-short" id="missive-short"></span>
        <span class="missive-count" id="missive-count"></span>
      </button>
    </div>

    <div class="top-right">
      <button type="button" class="parchment journal-button" id="journal-open"
              aria-haspopup="dialog" data-t-aria="journal.button">
        <span class="journal-icon" id="journal-icon"></span><span data-t="journal.button"></span>
        <span class="journal-signal" aria-hidden="true"></span>
      </button>
      <!-- Accès rapides discrets : couper le son, ouvrir les Options -->
      <div class="quick">
        <button type="button" class="parchment quick-button" id="sound-toggle" aria-pressed="false"
                data-t-aria="sound.aria"><span id="sound-icon"></span></button>
        <button type="button" class="parchment quick-button" id="eco-toggle" aria-pressed="false"
                data-t-aria="eco.title" data-t-title="eco.title"><span id="eco-icon"></span></button>
        <button type="button" class="parchment quick-button" id="options-open"
                aria-haspopup="dialog" data-t-aria="options.title" data-t-title="options.title"><span id="options-icon"></span></button>
      </div>
    </div>

    <p id="hint" class="parchment hint" hidden></p>

    <!-- Conseil de premier contact (js/story/guide.js, TIPS) et aide d'un compteur -->
    <div class="parchment tip" id="tip" role="status" hidden>
      <p id="tip-text"></p>
      <button type="button" class="tip-close" id="tip-close" data-t-aria="tip.close"><span aria-hidden="true">✕</span></button>
    </div>
    <div class="parchment counter-tip" id="counter-tip" role="tooltip" hidden></div>

    <section class="parchment dialog" id="offline-notice" role="dialog" aria-labelledby="offline-title" hidden>
      <h2 id="offline-title" data-t="offline.title"></h2>
      <p id="offline-text"></p>
      <div class="actions">
        <button type="button" class="tool" id="offline-close" data-t="offline.close"></button>
      </div>
    </section>

    <section class="parchment dialog journal" id="journal" role="dialog" aria-labelledby="journal-title" hidden>
      <h2 id="journal-title" data-t="journal.title"></h2>
      <!-- Partie terminée : mention discrète et relecture de la dernière lettre -->
      <div class="watch-box" id="journal-watch" hidden>
        <p id="journal-watch-text"></p>
        <button type="button" class="tool secondary" id="journal-reread"></button>
      </div>
      <!-- Chemin : étapes du chapitre (js/story/path.js) -->
      <div class="path-box" id="journal-path">
        <h3 data-t="journal.path"></h3>
        <ol class="path-pips" id="path-pips" aria-hidden="true"></ol>
        <p class="path-now" id="path-now"></p>
        <p class="path-next" id="path-next"></p>
        <button type="button" class="path-toggle" id="path-toggle" aria-expanded="false" aria-controls="path-list"></button>
        <ol class="path-list" id="path-list" hidden></ol>
      </div>
      <div class="missive-box">
        <h3 data-t="journal.missives"></h3>
        <p id="missive-text"></p>
        <p class="missive-progress" id="missive-progress"></p>
      </div>
      <!-- Fragments générés depuis js/story/fragments.js -->
      <ol class="fragments" id="fragments"></ol>
      <div class="actions">
        <button type="button" class="tool" id="journal-close" data-t="close"></button>
      </div>
    </section>

    <!-- Phare du Lac : palier actuel, coût du suivant, « Élever » (non bloquant) -->
    <section class="parchment dialog lighthouse" id="lighthouse" role="dialog" aria-labelledby="lighthouse-title" hidden>
      <h2 id="lighthouse-title" data-t="lighthouse.title"></h2>
      <ol class="stage-track" id="lighthouse-track" aria-hidden="true"></ol>
      <p class="stage-line" id="lighthouse-stage"></p>
      <p class="stage-effect" id="lighthouse-effect"></p>
      <p class="stage-next" id="lighthouse-next"></p>
      <div class="actions">
        <button type="button" class="tool" id="lighthouse-elevate" data-t="lighthouse.elevate"></button>
        <button type="button" class="tool secondary" id="lighthouse-move" data-t="move"></button>
        <button type="button" class="tool secondary" id="lighthouse-close" data-t="close"></button>
      </div>
    </section>

    <!-- Fiche d'un bâtiment posé : rôle, production, état, « Déplacer » (non bloquant) -->
    <section class="parchment dialog lighthouse" id="building-card" role="dialog" aria-labelledby="card-title" hidden>
      <h2 id="card-title"></h2>
      <p class="stage-effect" id="card-role"></p>
      <p class="stage-line" id="card-production"></p>
      <p class="stage-next" id="card-state"></p>
      <p class="stage-line" id="card-level"></p>
      <p class="stage-next" id="card-upgrade"></p>
      <div class="actions">
        <button type="button" class="tool" id="card-upgrade-btn" data-t="upgrade" hidden></button>
        <button type="button" class="tool" id="card-move" data-t="move"></button>
        <button type="button" class="tool secondary" id="card-close" data-t="close"></button>
      </div>
    </section>

    <!-- Îlot du lac dans la brume : nom, coût en Reliques, « Rallier » (non bloquant) -->
    <section class="parchment dialog lighthouse island" id="island" role="dialog" aria-labelledby="island-title" hidden>
      <h2 id="island-title"></h2>
      <p class="stage-effect" id="island-blurb"></p>
      <p class="stage-next" id="island-cost"></p>
      <div class="actions">
        <button type="button" class="tool" id="island-rally" data-t="island.rally"></button>
        <button type="button" class="tool secondary" id="island-close" data-t="close"></button>
      </div>
    </section>

    <!-- Options : préférences hors sauvegarde de partie, et nouvelle partie -->
    <section class="parchment dialog options" id="options" role="dialog" aria-labelledby="options-title" hidden>
      <h2 id="options-title" data-t="options.title"></h2>
      <div class="option-row">
        <button type="button" class="option-toggle" id="options-sound" aria-pressed="false">
          <span class="option-icon" id="options-sound-icon"></span><span id="options-sound-label"></span>
        </button>
        <input type="range" class="sound-volume" id="sound-volume" min="0" max="100" step="5"
               aria-label="Volume">
      </div>
      <div class="option-row">
        <button type="button" class="option-toggle" id="day-toggle" aria-pressed="false">
          <span class="option-icon" id="day-icon"></span><span id="day-label"></span>
        </button>
      </div>
      <div class="option-row">
        <button type="button" class="option-toggle" id="eco-option" aria-pressed="false">
          <span class="option-icon" id="eco-option-icon"></span><span id="eco-option-label"></span>
        </button>
      </div>
      <div class="option-row quality-row">
        <span class="option-label" id="quality-label" data-t="quality.label"></span>
        <div class="quality-choice" id="quality-choice" role="radiogroup" aria-labelledby="quality-label">
          <button type="button" role="radio" data-choice="auto" data-t="quality.auto"></button>
          <button type="button" role="radio" data-choice="low" data-t="quality.low"></button>
          <button type="button" role="radio" data-choice="normal" data-t="quality.normal"></button>
          <button type="button" role="radio" data-choice="high" data-t="quality.high"></button>
        </div>
        <span class="option-note" id="quality-note"></span>
      </div>
      <div class="option-row">
        <button type="button" class="option-toggle" id="fps-toggle" aria-pressed="false">
          <span id="fps-label"></span>
        </button>
      </div>
      <div class="option-row">
        <button type="button" class="option-toggle" id="tips-reset" data-t="tips.reset"></button>
      </div>
      <h3 class="option-section" data-t="saves.title"></h3>
      <div class="option-row save-row">
        <button type="button" class="tool secondary" id="save-export" data-t="saves.export"></button>
        <button type="button" class="tool secondary" id="save-copy" data-t="saves.copy"></button>
        <button type="button" class="tool secondary" id="save-import" data-t="saves.import"></button>
      </div>
      <p class="option-note" id="save-feedback" role="status"></p>
      <textarea class="save-code" id="save-code" readonly rows="3" aria-label="Code de sauvegarde" hidden></textarea>
      <h4 class="option-subsection" data-t="saves.copies"></h4>
      <ul class="save-copies" id="save-copies"></ul>
      <div class="actions">
        <button type="button" class="tool secondary" id="new-game" data-t="newgame"></button>
        <button type="button" class="tool" id="options-close" data-t="close"></button>
      </div>
    </section>

    <!-- Lettre d'un nouveau chapitre (js/story/guide.js, CHAPTER_LETTERS) -->
    <div class="backdrop soft" id="chapter-backdrop" hidden>
      <section class="parchment dialog letter" id="chapter-letter" role="dialog" aria-modal="true" aria-labelledby="chapter-title">
        <h2 id="chapter-title"></h2>
        <div class="letter-body" id="chapter-body"></div>
        <p class="letter-signature" id="chapter-signature"></p>
        <div class="actions">
          <button type="button" class="tool" id="chapter-accept"></button>
        </div>
      </section>
    </div>

    <!-- Import (fichier ou code) et restauration d'une copie : saisie, puis résumé et confirmation -->
    <div class="backdrop" id="swap-backdrop" hidden>
      <section class="parchment dialog swap" id="swap" role="dialog" aria-modal="true" aria-labelledby="swap-title">
        <h2 id="swap-title"></h2>
        <div id="swap-input">
          <p data-t="swap.code"></p>
          <textarea class="save-code" id="swap-text" rows="4" spellcheck="false" autocomplete="off" aria-label="Code de sauvegarde"></textarea>
          <input type="file" id="swap-file" accept=".json,application/json,text/plain" hidden>
        </div>
        <div id="swap-confirm" hidden>
          <p class="swap-detail" id="swap-detail"></p>
          <p id="swap-warn"></p>
        </div>
        <p class="swap-error" id="swap-error" role="alert" hidden></p>
        <div class="actions" id="swap-actions-input">
          <button type="button" class="tool secondary" id="swap-cancel" data-t="swap.cancel"></button>
          <button type="button" class="tool secondary" id="swap-pick" data-t="swap.file"></button>
          <button type="button" class="tool" id="swap-read" data-t="swap.read"></button>
        </div>
        <div class="actions" id="swap-actions-confirm" hidden>
          <button type="button" class="tool" id="swap-back"></button>
          <button type="button" class="tool secondary" id="swap-go"></button>
        </div>
      </section>
    </div>

    <div class="backdrop" id="reset-backdrop" hidden>
      <section class="parchment dialog" id="reset-confirm" role="alertdialog"
               aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-text">
        <h2 id="reset-title" data-t="reset.title"></h2>
        <p id="reset-text" data-t="reset.text"></p>
        <div class="actions">
          <button type="button" class="tool" id="reset-keep" data-t="reset.keep"></button>
          <button type="button" class="tool secondary" id="reset-go" data-t="reset.go"></button>
        </div>
      </section>
    </div>

    <!-- Indicateur discret après chaque sauvegarde automatique -->
    <div class="saved-mark" id="saved-mark" aria-hidden="true" hidden><span id="saved-icon"></span><span data-t="saved.label"></span></div>

    <!-- Outils générés depuis js/buildings/catalog.js -->
    <nav class="parchment toolbar" id="toolbar" data-t-aria="tools.aria">
      <!-- Défile horizontalement s'il y a trop d'outils ; bords estompés = autres boutons -->
      <div class="tools" id="tools"></div>
      <button type="button" class="tool cancel" id="cancel" hidden>
        <span aria-hidden="true">✕</span>
        <span class="cancel-label" data-t="cancel"></span>
      </button>
    </nav>
  </div>
  <noscript>Ce jeu nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
